<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="base:app_id" content="6a1e989b48bd6000dbb5b58f" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Base Quest Scout</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#0d1829; --line:#29405f; --text:#e8f0ff; --muted:#a9b7d0; --blue:#93c5fd; --green:#34d399; --yellow:#fbbf24; --red:#fb7185; }
    * { box-sizing: border-box; }
    body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px auto; max-width: 1080px; line-height: 1.65; background: var(--bg); color: var(--text); padding: 0 18px; }
    a { color: var(--blue); overflow-wrap: anywhere; }
    .hero { padding: 24px; border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(135deg,#0d1829,#111f3a); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 18px 0; }
    .stat, .card { border: 1px solid var(--line); border-radius: 18px; padding: 16px; background: var(--panel); }
    .safe { border-color: var(--green); }
    .confirm { border-color: var(--yellow); }
    .hard { border-color: var(--red); }
    .meta { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:4px 10px; margin:4px 6px 4px 0; color: var(--muted); }
    .tag { display:inline-block; border-radius:999px; padding:2px 8px; margin:3px 4px 3px 0; background:#13233b; color:#cbd5e1; font-size:13px; }
    .score { font-size: 28px; font-weight: 750; }
    summary { cursor:pointer; color:#bfdbfe; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 6vw, 54px); }
    h2 { margin-top: 0; }
    footer { margin: 28px 0 10px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="application/json" id="scout-data">__DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('scout-data').textContent);
    const classes = { auto_track_zero_cost: 'safe', manual_confirmation_required: 'confirm', hard_stop: 'hard' };
    const labels = { auto_track_zero_cost: '自动跟踪：零成本/只读', manual_confirmation_required: '确认后继续：账号/钱包/社交边界', hard_stop: '硬停止：签名/资金/收益/KYC' };
    const html = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const app = document.getElementById('app');
    const counts = data.items.reduce((acc, item) => (acc[item.decision] = (acc[item.decision] || 0) + 1, acc), {});
    app.innerHTML = `
      <section class="hero">
        <h1>Base Quest Scout</h1>
        <p>只读 Base 生态机会雷达：寻找零成本/低成本学习与建设机会，标注 wallet/signature/gas/reward 风险；不替用户交易、签名、领水、发帖或提交资料。</p>
        <p><span class="pill">Generated: ${html(data.generated_at)}</span><span class="pill">Mode: readonly</span><span class="pill">No gas / no signature / no submit</span></p>
      </section>
      <section class="grid">
        <div class="stat safe"><div class="meta">auto track</div><div class="score">${counts.auto_track_zero_cost || 0}</div><div>只读可自动跟踪</div></div>
        <div class="stat confirm"><div class="meta">needs confirmation</div><div class="score">${counts.manual_confirmation_required || 0}</div><div>需要人工确认边界</div></div>
        <div class="stat hard"><div class="meta">hard stop</div><div class="score">${counts.hard_stop || 0}</div><div>涉及签名/资金/KYC</div></div>
      </section>
      ${data.items.map(item => `
        <section class="card ${classes[item.decision] || 'confirm'}">
          <div class="meta">${html(item.id)} · ${html(labels[item.decision] || item.decision)}</div>
          <h2>${html(item.title)}</h2>
          <p>${html(item.description)}</p>
          <p><a href="${html(item.url)}" rel="noopener noreferrer">${html(item.url)}</a></p>
          <p>${(item.signals || []).map(signal => `<span class="tag">${html(signal)}</span>`).join('')}</p>
          <details><summary>Evidence snippets</summary><ul>${(item.evidence || ['No strong signal extracted.']).map(e => `<li>${html(e)}</li>`).join('')}</ul></details>
        </section>`).join('')}
    `;
  </script>
  <footer>Generated from public pages only. User confirmation is required before wallet, funds, KYC, rewards, or external social actions.</footer>
</body>
</html>
