name: Update Base Quest Scout

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: base-quest-scout-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build static radar
        run: python scripts/build.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/latest.json
          git diff --cached --quiet || git commit -m "Update Base Quest Scout data"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            git reset --soft origin/main
            git add index.html data/latest.json
            git diff --cached --quiet && exit 0
            git commit -m "Update Base Quest Scout data"
          done
          git push
